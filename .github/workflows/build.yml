name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:

  # ── Run all tests ────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run all tests
        run: cargo test --verbose

      - name: Run uci-wasm feature tests
        # src/uci_wasm.rs's tests (Phase 30) are gated behind the
        # uci-wasm feature, which is not part of `default = []` — the
        # step above never compiles or runs them. Runs against the
        # native host target (not wasm32); wasm-bindgen supports this
        # directly, so no wasm-bindgen-test-runner/browser setup needed.
        run: cargo test --verbose --features uci-wasm

      - name: Run PlayStyle tests (serial, isolated from the rest of the suite)
        # Session 111: these 10 tests (8 in eval/style.rs, 2 in
        # texel/predict.rs) mutate the process-global PLAY_STYLE atomic,
        # which search::alpha_beta's leaf eval reads UNCONDITIONALLY on
        # every node of every search — including searches run by totally
        # unrelated tests (search::iterative's ThreatDefusal test flaked
        # in CI this way: a concurrently-scheduled PlayStyle test flipped
        # the global mid-search on another thread). `#[ignore]`d above so
        # the "Run all tests" step doesn't run them concurrently with
        # anything, and re-run here at --test-threads=1 — nothing else in
        # the binary can be executing at the same time, which is the
        # actual requirement (not "don't race each other," but "don't
        # race anything"). Same pattern this project already uses for
        # node_count's benchmark-style tests, just above.
        run: |
          cargo test --lib -- --ignored --test-threads=1 eval::style::tests:: texel::predict::tests::

  # ── Build native binaries for all platforms ──────────────────────────
  build:
    name: Build — ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: pet_dragon.exe
            asset_name: pet-dragon-windows-x64.exe

          # macOS (Apple Silicon + Intel)
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: pet_dragon
            asset_name: pet-dragon-macos-arm64

          - os: macos-latest
            target: x86_64-apple-darwin
            binary: pet_dragon
            asset_name: pet-dragon-macos-x64

          # Linux
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: pet_dragon
            asset_name: pet-dragon-linux-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: >
          cargo build
          --release
          --target ${{ matrix.target }}
          --bin pet_dragon

      - name: Rename binary
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} \
             dist/${{ matrix.asset_name }}

      - name: Upload binary as artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}
          retention-days: 7

  # ── Regression gate (D48/23.1): candidate vs main over real UCI ──────
  # Lightweight SPRT-style pass/fail check, run automatically on every PR
  # (not manual-dispatch like uci_match_runner.yml). Builds the PR's own
  # pet_dragon binary ("candidate") and a second pet_dragon built from the
  # current tip of `main` ("baseline"), plays them against each other over
  # real UCI via uci_match_runner (D36), and fails this job — blocking
  # merge once branch protection marks it required — if the candidate's
  # score against the baseline falls below the threshold. Deliberately
  # small game count / fast movetime to keep this affordable on every PR;
  # it is a coarse smoke check for clear regressions, not a precise Elo
  # measurement (use uci_match_runner.yml manually for that).
  regression-gate:
    name: Regression Gate (D48)
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout candidate (PR head)
        uses: actions/checkout@v6
        with:
          path: candidate

      - name: Checkout baseline (current main)
        uses: actions/checkout@v6
        with:
          ref: main
          path: baseline

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Rust dependencies (candidate)
        uses: Swatinem/rust-cache@v2
        with:
          key: regression-gate-candidate
          workspaces: candidate

      - name: Cache Rust dependencies (baseline)
        uses: Swatinem/rust-cache@v2
        with:
          key: regression-gate-baseline
          workspaces: baseline

      - name: Build harness (candidate)
        run: cargo build --release --bin uci_match_runner --manifest-path candidate/Cargo.toml

      - name: Build candidate engine
        run: cargo build --release --bin pet_dragon --manifest-path candidate/Cargo.toml

      - name: Build baseline engine
        run: cargo build --release --bin pet_dragon --manifest-path baseline/Cargo.toml

      - name: Run regression gate match (candidate vs main, D48)
        run: >
          ./candidate/target/release/uci_match_runner
          ./candidate/target/release/pet_dragon
          ./baseline/target/release/pet_dragon
          20
          50
          0
          "Candidate (PR ${{ github.event.pull_request.number }})"
          "Baseline (main)"
          regression_gate_results.txt
          ""
          ""
          35

      - name: Print result summary
        if: always()
        run: cat regression_gate_results.txt || true

      - name: Upload regression gate results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: regression-gate-results-pr${{ github.event.pull_request.number }}
          path: regression_gate_results.txt
          retention-days: 14

  # ── Build WASM package: .wasm, JS bindings, standalone bundle ────────
  build-wasm:
    name: Build — WASM
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WebAssembly package
        run: |
          wasm-pack build \
            --target web \
            --release \
            --out-dir dist-wasm \
            --out-name pet_dragon \
            -- --features wasm

      - name: Generate standalone base64-embedded bundle
        run: |
          mkdir -p dist
          cp dist-wasm/pet_dragon_bg.wasm dist/pet_dragon_bg.wasm
          cp dist-wasm/pet_dragon.js dist/pet_dragon.js
          node -e "
            const fs = require('fs');
            const bytes = fs.readFileSync('dist-wasm/pet_dragon_bg.wasm');
            const b64 = bytes.toString('base64');
            const out = [
              '// Pet Dragon — standalone WASM bundle (auto-generated, do not edit by hand)',
              '// Embeds the compiled .wasm binary as base64 so it can be initialized',
              '// without a separate network fetch of pet_dragon_bg.wasm. Still needs',
              '// pet_dragon.js alongside this file (same directory/import path) —',
              '// this file supplies the bytes, pet_dragon.js supplies the bindings.',
              '//',
              '// Usage:',
              '//   import { initPetDragon } from \'./pet_dragon_standalone.js\';',
              '//   const engine = await initPetDragon();',
              '//   engine.engine_name();',
              'import init, * as bindings from \'./pet_dragon.js\';',
              '',
              'const WASM_BASE64 = \"' + b64 + '\";',
              '',
              'function base64ToBytes(base64) {',
              '  const binary = atob(base64);',
              '  const bytes = new Uint8Array(binary.length);',
              '  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);',
              '  return bytes;',
              '}',
              '',
              'export async function initPetDragon() {',
              '  const bytes = base64ToBytes(WASM_BASE64);',
              '  await init(bytes);',
              '  return bindings;',
              '}',
              '',
              'export * from \'./pet_dragon.js\';',
              ''
            ].join('\n');
            fs.writeFileSync('dist/pet_dragon_standalone.js', out);
          "

      - name: Verify build output
        run: ls -la dist/


      - name: Upload WASM package as artifact
        uses: actions/upload-artifact@v6
        with:
          name: pet-dragon-wasm
          path: |
            dist/pet_dragon_bg.wasm
            dist/pet_dragon.js
            dist/pet_dragon_standalone.js
          retention-days: 7

      # ── UCI-protocol WASM build (Phase 30.7) ────────────────────────
      # Mirrors the block above for the `uci-wasm` feature (Phase 30.1-
      # 30.4), which deploy.yml already publishes to web/pkg-uci/ for
      # GitHub Pages. This step additionally publishes the same bundle
      # as a downloadable release asset, same as the gameplay `wasm`
      # feature's bundle above — a second, independent WASM target,
      # never built in the same wasm-pack invocation as `wasm`.
      - name: Build UCI-protocol WebAssembly package
        run: |
          wasm-pack build \
            --target web \
            --release \
            --out-dir dist-wasm-uci \
            --out-name pet_dragon_uci \
            -- --features uci-wasm

      - name: Copy UCI-protocol WASM output
        run: |
          cp dist-wasm-uci/pet_dragon_uci_bg.wasm dist/pet_dragon_uci_bg.wasm
          cp dist-wasm-uci/pet_dragon_uci.js dist/pet_dragon_uci.js

      - name: Verify UCI-protocol build output
        run: ls -la dist/

      - name: Upload UCI-protocol WASM package as artifact
        uses: actions/upload-artifact@v6
        with:
          name: pet-dragon-uci-wasm
          path: |
            dist/pet_dragon_uci_bg.wasm
            dist/pet_dragon_uci.js
          retention-days: 7

  # ── Node count benchmarks (tracks search pruning efficiency) ─────────
  bench:
    name: Node Count Bench
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: bench-release

      - name: Run node count benchmarks
        # --profile bench-tests = opt-level 3 but panic=unwind (required for test harness)
        # panic=abort in [profile.release] silently kills the test binary — do not use --release here
        run: cargo test --profile bench-tests node_count -- --ignored --nocapture
        
  # ── Publish release when tests pass & binaries are built ─────────────
  release:
    name: Publish Release
    needs: [ build, build-wasm ]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download all binaries
        uses: actions/download-artifact@v7
        with:
          path: dist/

      - name: Get short commit hash
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('Pet Dragon {0}', github.ref_name) || 'Pet Dragon — Latest Build' }}
          body: |
            ## Pet Dragon Chess Engine

            ${{ startsWith(github.ref, 'refs/tags/v') && format('**Tagged release {0}.**', github.ref_name) || '**Automatically built from latest `main` (rolling — may be ahead of the last tagged version).**' }}
            Commit: ${{ steps.sha.outputs.short }}

            Pet Dragon is an original chess variant engine, built natively in
            Rust, where every game starts from one of 2,162,160 distinct
            legal opening positions. Alpha-beta search with PVS and Lazy
            SMP, Texel-tuned handcrafted evaluation, full UCI protocol
            (pondering, MultiPV, Skill Levels, Contempt), Syzygy tablebase
            support.

            Play in the browser: https://g-c-3.github.io/pet-dragon

            ### Downloads
            | Platform | File |
            |---|---|
            | Windows 64-bit | `pet-dragon-windows-x64.exe` |
            | macOS Apple Silicon | `pet-dragon-macos-arm64` |
            | macOS Intel | `pet-dragon-macos-x64` |
            | Linux 64-bit | `pet-dragon-linux-x64` |
            | WASM binary | `pet_dragon_bg.wasm` |
            | WASM JS bindings | `pet_dragon.js` |
            | WASM standalone bundle (embeds the binary as base64 — no separate `.wasm` fetch needed, still requires `pet_dragon.js` alongside it) | `pet_dragon_standalone.js` |
            | UCI-protocol WASM binary (Phase 30, real UCI text protocol — see `uci_wasm.rs`) | `pet_dragon_uci_bg.wasm` |
            | UCI-protocol WASM JS bindings | `pet_dragon_uci.js` |

            ### How to use
            Connect to any UCI chess GUI (Arena, BanksiaGUI, CuteChess).

            Copyright © 2026 Gokul Chandar. Licensed under GPL v3.
          files: dist/**/*
          make_latest: ${{ startsWith(github.ref, 'refs/tags/v') }}
          prerelease: false
