name: Elo A/B Match

# Manual trigger only — run from the Actions tab ("Run workflow" button),
# fully usable from the mobile GitHub app, no terminal needed.
on:
  workflow_dispatch:
    inputs:
      num_games:
        description: "Number of games to play"
        required: false
        default: "20"
        type: string
      weight_a:
        description: "Engine A NNUE blend weight percent (0-100) — ignored if flag_name is set (forced to 0)"
        required: false
        default: "0"
        type: string
      weight_b:
        description: "Engine B NNUE blend weight percent (0-100) — ignored if flag_name is set (forced to 0)"
        required: false
        default: "25"
        type: string
      movetime_ms:
        description: "Milliseconds of think time per move"
        required: false
        default: "100"
        type: string
      seed_start:
        description: "Starting seed (change between runs for different games, otherwise reruns replay the same games)"
        required: false
        default: "0"
        type: string
      flag_name:
        description: "Experimental SearchInfo flag to SPRT-test instead of NNUE weight (Phase 34.1)"
        required: false
        default: "none"
        type: choice
        options:
          - none
          - nonpawn_correction
          - continuation_correction
          - improving
      flag_a:
        description: "Engine A's value for flag_name (only used if flag_name != none)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      flag_b:
        description: "Engine B's value for flag_name (only used if flag_name != none) — default true tests flipping the shipped false default"
        required: false
        default: "true"
        type: choice
        options:
          - "false"
          - "true"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  match:
    name: Run Elo A/B Match
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: match-runner-release

      - name: Build match_runner binary
        run: cargo build --release --bin match_runner

      - name: Run Elo A/B match
        run: >
          ./target/release/match_runner
          ${{ inputs.num_games }}
          ${{ inputs.weight_a }}
          ${{ inputs.weight_b }}
          ${{ inputs.movetime_ms }}
          ${{ inputs.seed_start }}
          match_results.txt
          ${{ inputs.flag_name }}
          ${{ inputs.flag_a }}
          ${{ inputs.flag_b }}

      - name: Print summary
        run: cat match_results.txt

      - name: Upload match results as artifact
        uses: actions/upload-artifact@v6
        with:
          name: match-results-${{ inputs.flag_name }}-a${{ inputs.weight_a }}-b${{ inputs.weight_b }}-n${{ inputs.num_games }}-seed${{ inputs.seed_start }}
          path: match_results.txt
          retention-days: 30
