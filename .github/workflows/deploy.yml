name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:

  build:
    name: Build WASM & Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Create web folders
        run: mkdir -p web/pkg web/pkg-uci

      - name: Build WebAssembly (browser gameplay API — web/index.html, web/pit/vs.html)
        run: |
          wasm-pack build \
            --target web \
            --release \
            --out-dir web/pkg \
            --out-name pet_dragon \
            -- --features wasm

      - name: Build WebAssembly (real UCI protocol — uci_command export)
        run: |
          wasm-pack build \
            --target web \
            --release \
            --out-dir web/pkg-uci \
            --out-name pet_dragon_uci \
            -- --features uci-wasm

      - name: Verify build output
        run: |
          echo "Browser-API WASM package contents:"
          ls -la web/pkg/
          echo "UCI-protocol WASM package contents:"
          ls -la web/pkg-uci/

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
